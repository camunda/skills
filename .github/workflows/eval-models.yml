name: 🧪 Model comparison matrix

# Runs every outcome eval (with_skill arm) through the GitHub Copilot CLI agent
# against several Copilot models and renders a skill × model matrix — pass rate,
# linter attempts, cost (Copilot AI credits, premium requests, tokens), and
# agent time — to inform model recommendations. Informational only: no pass/fail
# gate (baselines are model-specific). Uploads the matrix (Markdown + JSON) and
# the raw .eval logs. See evals/docs/ci.md.
#
# Auth: the job's own GITHUB_TOKEN with `copilot-requests: write` — no PAT. Needs
# the org policy "Allow use of Copilot CLI billed to the organization"; usage is
# billed to the org.
#
# Cost scales with dataset samples × models × epochs — narrow with `target` for a
# partial run. Manual-only for now; uncomment the schedule to run monthly.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated Copilot CLI model ids (as accepted by copilot --model)"
        type: string
        default: "claude-sonnet-5.5,claude-opus-5.5,claude-haiku-5.5,gpt-6.1-sol,gemini-4-argon"
      epochs:
        description: "Epochs per sample (repeat runs for stable medians)"
        type: number
        default: 3
      target:
        description: "Optional substring of the target path to narrow the run (e.g. camunda-bpmn)"
        type: string
        default: ""
  # schedule:
  #   - cron: "0 4 1 * *"  # 04:00 UTC on the 1st of each month

permissions:
  contents: read

concurrency:
  group: eval-models
  cancel-in-progress: false

env:
  # Defaults for scheduled runs, where `inputs` is empty.
  MODELS: ${{ inputs.models || 'claude-sonnet-5.5,claude-opus-5.5,claude-haiku-5.5,gpt-6.1-sol,gemini-4-argon' }}
  EPOCHS: ${{ inputs.epochs || 3 }}
  # Fixed LLM judge (Inspect, via ANTHROPIC_API_KEY) for the model_graded_qa
  # scorer in camunda-development, so every Copilot model is graded alike.
  GRADER_MODEL: ${{ vars.EVAL_MODEL || 'anthropic/claude-sonnet-4-6' }}

jobs:
  detect:
    name: Enumerate targets × models
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.matrix.outputs.specs }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - id: matrix
        env:
          TARGET: ${{ inputs.target }}
        run: |
          uv run evals-build-matrix --models "$MODELS" --epochs "$EPOCHS" --target "$TARGET" > specs.json
          if [ "$(jq length specs.json)" -eq 0 ]; then
            echo "::error::No outcome targets matched target='$TARGET'"
            exit 1
          fi
          echo "specs=$(cat specs.json)" >> "$GITHUB_OUTPUT"

  # Build the sandbox images once and ship them to the matrix as an artifact
  # (see eval.yml for the rationale). Nothing is published.
  build-images:
    name: Build sandbox images
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/build-sandbox-images

      - name: Save images
        working-directory: evals
        run: |
          docker save camunda-skills-evals-base:latest \
                      camunda-skills-evals-with-c8ctl:latest \
                      camunda-skills-evals-verifier:latest \
            | zstd -T0 > sandbox-images.tar.zst

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-images-${{ github.run_id }}
          path: evals/sandbox-images.tar.zst
          retention-days: 1
          overwrite: true

  run:
    name: ${{ matrix.label }}
    needs: [detect, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      # Cap concurrent Copilot sessions to stay under rate limits.
      max-parallel: 6
      matrix:
        include: ${{ fromJson(needs.detect.outputs.specs) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Load sandbox images
        if: matrix.sandbox
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sandbox-images-${{ github.run_id }}
          path: /tmp/sandbox-images

      - name: docker load
        if: matrix.sandbox
        run: zstd -dc /tmp/sandbox-images/sandbox-images.tar.zst | docker load

      - name: Run eval
        # The copilot_cli agent installs Copilot CLI in the sandbox and runs it
        # there; Inspect itself makes no model call (`--model none`) except the
        # pinned grader. The job token is handed to the sandbox outside Inspect's
        # event log and stripped from the agent's shell (see core/copilot_cli.py).
        # A failed or errored sample is data for the matrix: --no-fail-on-error
        # keeps the remaining samples running and records the error instead.
        working-directory: evals
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: ${{ matrix.model }}
          COPILOT_CLI_VERSION: ${{ vars.COPILOT_CLI_VERSION || 'latest' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run inspect eval "${{ matrix.spec }}" --log-dir logs/ --display ${{ matrix.display }} ${{ matrix.limit }} \
            --model none \
            --model-role "grader=$GRADER_MODEL" \
            --metadata "copilot_model=$COPILOT_MODEL" \
            --no-fail-on-error \
            ${{ matrix.targs }}

      - name: Stage per-job logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-models-logs-${{ matrix.slug }}-${{ github.run_attempt }}
          path: evals/logs/
          retention-days: 1

  summarize:
    name: Build model matrix
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Collect per-job logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: evals/logs/
          pattern: eval-models-logs-*
          merge-multiple: true

      - name: Render matrix
        run: |
          mkdir -p evals/logs evals/model-matrix
          uv run evals-model-matrix --log-dir evals/logs/ --models "$MODELS" \
            --out-md evals/model-matrix/model-matrix.md \
            --out-json evals/model-matrix/model-matrix.json \
            || printf '_Model matrix generation failed — see job logs._\n' > evals/model-matrix/model-matrix.md
          cat evals/model-matrix/model-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload matrix + logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-matrix-${{ github.run_id }}
          path: |
            evals/model-matrix/
            evals/logs/
          retention-days: 90
          # run_id is stable across re-runs; replace the earlier attempt's matrix.
          overwrite: true
