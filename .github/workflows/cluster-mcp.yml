name: cluster-mcp

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/cluster-mcp/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/cluster-mcp.yml"
  push:
    branches: [main]
    paths:
      - "packages/cluster-mcp/**"
      - ".github/workflows/cluster-mcp.yml"

permissions:
  contents: read

jobs:
  build:
    name: cluster-mcp build and smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cluster-mcp
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/cluster-mcp/package-lock.json
      - run: npm ci
      - name: Build (type-check, bundle)
        run: npm run build
      - name: Smoke test against a fake cluster (OAuth, basic auth, tool merge, list_changed)
        run: npm run smoke
      - name: Package contents
        run: npm pack --dry-run
      - name: Claude Desktop extension (.mcpb) validates and packs
        run: npm run pack:mcpb
